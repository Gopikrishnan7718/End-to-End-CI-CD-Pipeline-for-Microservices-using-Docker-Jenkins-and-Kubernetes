apiVersion: apps/v1
kind: Deployment

metadata:
    name: db-deployment
    labels:
      app: db
      type: backend

spec:

  replicas: 1
  selector: 
      matchLabels:
        app: postgres
        type: backend


  template:
    metadata:

      labels:
        app: postgres
        type: backend


    spec:
      containers:
          - image: postgres:15
            name: db-container

            ports:
            - containerPort: 5432

            env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

            - name: POSTGRES_DB
              value: postgres

            volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgres/data
                 



      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
