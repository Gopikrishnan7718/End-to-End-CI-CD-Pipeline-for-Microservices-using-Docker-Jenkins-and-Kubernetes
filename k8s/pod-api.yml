apiVersion: v1
kind: Pod

metadata:
  name: fib-api-pod

  labels:
    app: api
    type: backend

spec:
  containers:
    - image: gopidoc77/fib-server:latest
      name: api-container

      ports:
        - containerPort: 5000

      env:
        - name: REDIS_HOST
          value: redis

        - name: REDIS_PORT
          value: "6379"

        - name: PGHOST
          value: postgres

        - name: PGPORT
          value: "5432"

        - name: PGUSER
          value: postgres

        - name: PGPASSWORD
          value: postgres

        - name: PGDATABASE
          value: postgres       
