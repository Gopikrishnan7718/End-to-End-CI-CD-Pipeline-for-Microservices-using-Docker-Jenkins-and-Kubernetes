apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx
      type: frontend

  template:
    metadata:
      labels:
        app: nginx
        type: frontend

    spec:
      containers:
        - name: nginx-container

          image: gopidoc77/fib-nginx:latest

          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "200m"

          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d

      volumes:
        - name: nginx-config-volume

          configMap:
            name: nginx-config