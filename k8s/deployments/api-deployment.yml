apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-deployment
  labels:
    app: api
    type: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: api
      type: backend

  template:
    metadata:
      labels:
        app: api
        type: backend

    spec:
      containers:
        - image: gopidoc77/fib-server:latest
          name: api-container

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: postgres-secret

          livenessProbe:
            httpGet:
              path: /
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"