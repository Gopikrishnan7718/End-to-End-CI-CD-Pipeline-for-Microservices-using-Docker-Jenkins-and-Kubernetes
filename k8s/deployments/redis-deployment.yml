apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-deployment
  labels:
    app: redis
    type: backend

spec:

  selector:
      matchLabels:
          app: redis
          type: backend
  replicas: 1


  template:
    metadata:

      labels: 
            app: redis
            type: backend

    spec:
      containers:
       - name: redis-container
         image: redis:7-alpine

         volumeMounts:
          - name: redis-storage
            mountPath: /data

         ports:
          - containerPort: 6379

      volumes:
       - name: redis-storage
         persistentVolumeClaim:
            claimName: redis-pvc


