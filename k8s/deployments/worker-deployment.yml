apiVersion: apps/v1
kind: Deployment
metadata:
   name: worker-deployment
   labels:
           app: worker
           type: backend

spec:
  replicas: 3
  selector: 
    matchLabels:
              app: worker
              type: backend

  template:
     metadata:
  
       labels:
         app: worker
         type: backend

     spec:
       containers:
        - image: gopidoc77/fib-worker:latest
          name: worker-container
      
          env:
           - name: REDIS_HOST
             value: redis

           - name: REDIS_PORT
             value: "6379"
