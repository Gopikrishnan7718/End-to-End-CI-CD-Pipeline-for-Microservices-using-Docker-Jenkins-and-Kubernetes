apiVersion: apps/v1
kind: Deployment
metadata:
   name: worker-deployment
   labels:
           app: worker
           type: backend

spec:
  replicas: 3
  selector: 
    matchLabels:
              app: worker
              type: backend

  template:
     metadata:
  
       labels:
         app: worker
         type: backend

     spec:
       containers:
        - image: gopidoc77/fib-worker:latest
          name: worker-container
      
          envFrom:
           - configMapRef:
             name: app-config
   
          resources:
              requests:
                memory: "128Mi"
                cpu: "100m"

              limits:
                memory: "256Mi"
                cpu: "500m"
          

          
