apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres-statefulset

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres
      type: backend

  template:
    metadata:
      labels:
        app: postgres
        type: backend

    spec:
      containers:
        - name: postgres-container

          image: postgres:15

          ports:
            - containerPort: 5432

          envFrom:
            - configMapRef:
                name: postgres-config

            - secretRef:
                name: postgres-secret

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data


          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "1000m"


  volumeClaimTemplates:
    - metadata:
        name: postgres-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi