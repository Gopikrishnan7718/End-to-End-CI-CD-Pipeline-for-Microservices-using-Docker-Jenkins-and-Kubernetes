apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis-statefulset

spec:
  serviceName: redis

  replicas: 1

  selector:
    matchLabels:
      app: redis
      type: backend

  template:
    metadata:
      labels:
        app: redis
        type: backend

    spec:
      containers:
        - name: redis-container

          image: redis:7-alpine

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-storage
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: redis-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi