apiVersion: v1
kind: ConfigMap

metadata:
  name: nginx-config

data:
  default.conf: |

    upstream client {
        server client:3000;
    }

    upstream api {
        server api:5000;
    }

    server {

        listen 80;

        location / {
            proxy_pass http://client;
        }

        location /api {
            proxy_pass http://api;
        }
    }